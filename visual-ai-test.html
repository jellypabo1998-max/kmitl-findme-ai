<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Visual AI check — FindMe AI</title><link rel="stylesheet" href="style.css?v=20261006-pin5"></head><body><main class="container page-wrap"><div class="kicker">VISUAL AI CHECK</div><h1>ทดสอบ AI เทียบรูป</h1><p>ใช้ภาพวาดตัวอย่างสองรูป ทดสอบว่า AI จัดรูปเดียวกันไว้ก่อนรูปอื่น โดยไม่สร้างรายงานหรือบัญชี</p><button class="btn btn-dark" id="run">ทดสอบเปรียบเทียบรูป</button><p id="status" role="status"></p><div style="display:flex;gap:24px"><figure><img id="same" alt="ภาพตัวอย่างเดียวกับภาพค้นหา" style="width:180px;height:180px;object-fit:contain"><figcaption>ภาพเดียวกับที่ค้นหา</figcaption></figure><figure><img id="different" alt="ภาพตัวอย่างอีกภาพ" style="width:180px;height:180px;object-fit:contain"><figcaption>อีกภาพ</figcaption></figure></div><pre id="result"></pre></main><script type="module">
const make=(different)=>{const c=document.createElement('canvas');c.width=224;c.height=224;const x=c.getContext('2d');x.fillStyle=different?'#153050':'#f7eddf';x.fillRect(0,0,224,224);x.fillStyle=different?'#35e1ef':'#d59021';if(different){x.fillRect(35,65,150,90);x.fillStyle='#fff';x.fillRect(45,75,130,55);}else{x.beginPath();x.arc(90,80,35,0,Math.PI*2);x.fill();x.fillRect(90,80,20,110);x.fillRect(95,150,40,15);}return c.toDataURL('image/png');};
const same=make(false),different=make(true);document.getElementById('same').src=same;document.getElementById('different').src=different;
document.getElementById('run').onclick=()=>{const button=document.getElementById('run');button.disabled=true;const status=document.getElementById('status');status.textContent='กำลังโหลดโมเดล…';const worker=new Worker('./image-search-worker.js',{type:'module'});worker.onmessage=({data})=>{if(data.status==='loading')status.textContent=`โหลดโมเดล ${data.progress}%`;if(data.status==='matching')status.textContent=`เทียบรูป ${data.done+1}/${data.total}`;if(data.status==='done'){status.textContent=data.results[0]?.id==='same'?'ผ่าน: AI เรียงภาพเดียวกันเป็นอันดับแรก':'ผลทดสอบไม่ผ่าน';document.getElementById('result').textContent=JSON.stringify(data.results,null,2);worker.terminate();button.disabled=false;}if(data.status==='error'){status.textContent=data.error;worker.terminate();button.disabled=false;}};worker.onerror=()=>{status.textContent='โหลด AI ไม่สำเร็จ';button.disabled=false;worker.terminate();};worker.postMessage({photo:same,items:[{id:'different',photo:different},{id:'same',photo:same}]});};
</script></body></html>
