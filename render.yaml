services:
  - type: web
    name: kmitl-findme-auth
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm install --omit=dev && npm test
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kmitl-findme-accounts
          property: connectionString
      - key: ALLOWED_ORIGINS
        value: https://jellypabo1998-max.github.io
      - key: RUN_AUTH_SMOKE_TEST
        value: "true"
      - key: NODE_ENV
        value: production
