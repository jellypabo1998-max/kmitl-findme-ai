services:
  web:
    build:
      context: .
      dockerfile: selfhost.Dockerfile
    ports:
      - "127.0.0.1:10000:10000"
    environment:
      PORT: "10000"
      NODE_ENV: production
      SELF_HOSTED_AUTH: "true"
      DATABASE_URL: "postgresql://findme:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/findme"
      ALLOWED_ORIGINS: "http://localhost:10000,http://127.0.0.1:10000"
      ROBOFLOW_INFERENCE_URL: "http://inference:9001"
      ROBOFLOW_API_KEY: "${ROBOFLOW_API_KEY:?Set ROBOFLOW_API_KEY in .env}"
    depends_on:
      db:
        condition: service_healthy
      inference:
        condition: service_started
    restart: unless-stopped
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: findme
      POSTGRES_DB: findme
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
    volumes:
      - accounts:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U findme -d findme"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  inference:
    image: roboflow/roboflow-inference-server-cpu:1.3.5-owlfix
    environment:
      PORT: "9001"
      ACTIVE_LEARNING_ENABLED: "false"
      MODEL_CACHE_DIR: /tmp/cache
    volumes:
      - models:/tmp/cache
    # No public ports: only the authenticated web service can call this container.
    restart: unless-stopped
volumes:
  accounts:
  models:
