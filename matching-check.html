<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ตรวจการจับคู่ประกาศ — FindMe AI</title><link rel="stylesheet" href="style.css?v=20261008-cases1"><style>body{padding:35px 18px}.container{max-width:1050px}#checks{padding:20px;background:#e8f6ee;border-radius:16px;margin:20px 0}.match-card{margin-bottom:18px}.notice{padding:15px;background:#fff0d6;border-radius:12px}</style><main class="container"><h1>ตรวจการจับคู่ประกาศ</h1><p class="notice">หน้านี้ใช้ข้อมูลจำลองเพื่อตรวจการทำงานของโค้ด ไม่ใช่ประกาศจริง และไม่ใช่การวัดความแม่นยำของ AI ไม่มีการบันทึกลงฐานข้อมูล</p><button class="btn btn-orange" id="run">ทดสอบการกรองและจัดอันดับ</button><p id="checks" role="status">กดเริ่มเพื่อตรวจการจับคู่</p><section id="submittedItem" class="form-card"><div id="submittedItemContent"></div></section><div id="matchSummary"></div><div id="matchList" class="match-list"></div><a href="matches.html">กลับหน้ารายการที่เกี่ยวข้อง</a></main><script src="app.js?v=20261019-matching1"></script><script>
const source={id:'check-lost',kind:'lost',category:'Wallet',itemName:'กระเป๋าสตางค์ Miu Miu',description:'สีชมพู มีโบว์',location:'Library',date:'2026-10-10',latitude:13.727,longitude:100.775};
const nearby={...source,id:'check-near',kind:'found',itemName:'กระเป๋าสตางค์ Miu Miu สีชมพู',date:'2026-10-11'};
const distant={...nearby,id:'check-far',itemName:'กระเป๋าสตางค์หนังสีดำ',description:'สีดำ หนังเรียบ',location:'Dormitory',latitude:14,longitude:101,date:'2026-12-10'};
const fixtures=[source,nearby,distant,{...nearby,id:'check-phone',category:'Phone',itemName:'โทรศัพท์ที่ต้องไม่แสดง'},{...nearby,id:'check-returned',status:'Returned',itemName:'คืนแล้วต้องไม่แสดง'},{...nearby,id:'check-deleted',deletedAt:'2026-10-11',itemName:'ลบแล้วต้องไม่แสดง'}];
readReports=()=>fixtures;
window.FindMeReports={contactHTML:()=>'<p class="meta">ผู้แจ้ง: บัญชีตัวอย่างสำหรับทดสอบ</p>'};
document.getElementById('run').onclick=()=>{const candidates=getMatchCandidates(source,fixtures),r=candidates.map(x=>({...x,score:matchBreakdown(source,x.item)})).sort((a,b)=>b.score.total-a.score.total);const unknown=matchBreakdown({kind:'lost',category:'Wallet'},{kind:'found',category:'Wallet'});const checks=[candidates.length===2,r[0].item.id==='check-near',unknown.total===25&&unknown.date===null,matchBreakdown(source,{...nearby,date:'2026-10-09'}).date===0];renderMatches();document.getElementById('checks').textContent=checks.every(Boolean)?'ผ่าน 4/4 ข้อ: กรองคนละหมวด/คืนแล้ว/ลบแล้ว · รายการใกล้เคียงอยู่ก่อน · ไม่สร้างคะแนนจากข้อมูลที่ขาด · ตรวจลำดับวันที่':'ตรวจพบข้อผิดพลาด';};
</script></html>
