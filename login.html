<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Log in — FindMe AI</title><link rel="stylesheet" href="style.css?v=20261006-pin5"><style>

</style><script src="auth-config.js?v=20261006-pin4"></script><script src="auth.js?v=20261006-pin4"></script></head><body><div class="login-container"><a class="brand-logo" href="index.html"><div class="brand-mark">F</div><div><b>FindMe AI</b><small>KMITL</small></div></a><div class="page-title" style="text-align:center"><div class="kicker">YOUR CAMPUS ACCOUNT</div><h1 style="font-size:42px">Welcome back</h1><p>เข้าสู่ระบบเพื่อตามหาของและติดตามรายงานของคุณ</p></div><form id="loginForm" class="form-card"><div class="form-grid" style="grid-template-columns:1fr"><div class="field"><label for="identifier">Email or Username</label><input id="identifier" name="identifier" required maxlength="254" autocomplete="username" placeholder="อีเมลหรือชื่อผู้ใช้"></div><div class="field"><label for="password">Password</label><input id="password" name="password" type="password" required maxlength="128" autocomplete="current-password" placeholder="รหัสผ่านของคุณ"></div></div><label class="remember-choice"><input name="remember" type="checkbox" checked> จดจำฉันบนเครื่องนี้ (30 วัน)</label><button class="btn btn-dark btn-block" type="submit">Log in</button></form><p class="auth-switch">ยังไม่มีบัญชี? <a href="register.html">สมัครสมาชิก →</a></p><p id="authError" class="login-error" role="alert" hidden></p></div></body></html>
