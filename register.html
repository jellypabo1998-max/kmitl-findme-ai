<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account — FindMe AI</title><link rel="stylesheet" href="style.css?v=20261006-pin5"><style>

</style><script src="auth-config.js?v=20261006-pin4"></script><script src="auth.js?v=20261006-pin4"></script></head><body><div class="login-container"><a class="brand-logo" href="index.html"><div class="brand-mark">F</div><div><b>FindMe AI</b><small>KMITL</small></div></a><div class="page-title" style="text-align:center"><div class="kicker">YOUR CAMPUS ACCOUNT</div><h1 style="font-size:42px">Join FindMe</h1><p>สมัครบัญชีสำหรับใช้งาน KMITL FindMe AI</p></div><form id="registerForm" class="form-card"><div class="form-grid" style="grid-template-columns:1fr"><div class="field"><label for="username">Username</label><input id="username" name="username" required minlength="3" maxlength="32" pattern="[a-zA-Z0-9_.-]{3,32}" autocomplete="username" placeholder="เช่น student_kmitl"><small class="meta">3–32 ตัว ภาษาอังกฤษ ตัวเลข จุด ขีด หรือขีดล่าง</small></div><div class="field"><label for="email">Email</label><input id="email" name="email" type="email" required maxlength="254" autocomplete="email" placeholder="you@example.com"></div><div class="field"><label for="password">Password</label><input id="password" name="password" type="password" required minlength="10" maxlength="128" autocomplete="new-password" placeholder="อย่างน้อย 10 ตัวอักษร"></div><div class="field"><label for="confirmPassword">Confirm password</label><input id="confirmPassword" name="confirmPassword" type="password" required minlength="10" maxlength="128" autocomplete="new-password" placeholder="กรอกรหัสผ่านอีกครั้ง"></div></div><label class="remember-choice"><input name="remember" type="checkbox" checked> จดจำฉันบนเครื่องนี้ (30 วัน)</label><button class="btn btn-dark btn-block" type="submit">Create account</button></form><p class="auth-switch">มีบัญชีแล้ว? <a href="login.html">เข้าสู่ระบบ →</a></p><p id="authError" class="login-error" role="alert" hidden></p></div></body></html>
