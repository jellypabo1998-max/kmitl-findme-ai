<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Reports — FindMe AI</title>
<link rel="stylesheet" href="style.css?v=20261008-unified2">
<style>
/* ===== ส่วนเสริมเฉพาะหน้านี้ (ใช้ตัวแปรสี/ฟอนต์จาก style.css) ===== */
.mr-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.mr-tab{border:1px solid #d4d4cf;background:#fff;color:#555;padding:10px 16px;border-radius:999px;font-weight:700;font-size:14px;cursor:pointer}
.mr-tab:hover{border-color:var(--ink)}
.mr-tab[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.mr-tab span{opacity:.6;margin-left:6px}
.mr-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.mr-card{padding:14px;display:flex;flex-direction:column}
.mr-photo{position:relative;flex:none;min-width:0;min-height:185px;height:185px;border-radius:15px;background:linear-gradient(145deg,#efefea,#deded8);display:flex;align-items:center;justify-content:center;font-size:48px;overflow:hidden}
.mr-photo img{display:block;position:static;flex:none;width:100%;height:185px;max-height:185px;object-fit:contain;object-position:center}
.mr-body{display:flex;flex-direction:column;gap:2px;flex:1;padding-top:13px}
.mr-body h3{font-family:Manrope,"Noto Sans Thai",sans-serif;margin:8px 0 2px;font-size:18px}
.mr-desc{font-size:14px;color:#444;margin:8px 0 0;line-height:1.55}
.mr-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.mr-actions .btn{padding:9px 14px;font-size:13px}
.btn-quiet{background:transparent;color:#555;border:1px solid transparent}.btn-quiet:hover{color:var(--ink)}
.btn-danger{background:transparent;color:var(--red);border:1px solid transparent}
.btn:disabled{opacity:.5;cursor:not-allowed}
.badge.pending{background:#fff4d6;color:#8a5a00}
.badge.locked{background:#fde8e4;color:var(--red)}
.mr-verify{max-width:760px}
.mr-summary{display:flex;gap:18px;align-items:center;padding-bottom:20px;margin-bottom:22px;border-bottom:1px solid var(--line)}
.mr-summary .mr-photo{width:110px;height:110px;min-height:110px;flex:none;font-size:40px}.mr-summary .mr-photo img{height:110px;max-height:110px}
.mr-summary h2{font-family:Manrope,"Noto Sans Thai",sans-serif;margin:8px 0 4px}
.hint{font-size:12px;color:#777;margin:0}
.box{padding:16px 18px;border-radius:16px;margin-bottom:18px;line-height:1.65}
.box.info{background:#f1f1ed;color:#333}
.box.bad{background:#fde8e4;color:#8d2a1b;border:1px solid #f3c3b9}
.bar{height:8px;border-radius:99px;background:#e6e6e1;overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;background:var(--orange)}
.mr-check{display:flex;gap:10px;align-items:flex-start;font-size:14px;font-weight:500}
.mr-check input{margin-top:4px}
.mr-log{margin:22px 0 0;padding:0;list-style:none;font-size:13px;color:#777}
.mr-log li{padding:4px 0;border-top:1px solid var(--line)}
.mr-verify .success{margin-top:0;margin-bottom:0}
.mr-verify .success + .btn,.mr-verify .box + .btn{margin-top:32px}
.mr-back{font-weight:700;font-size:14px}
.mr-modal-bg{position:fixed;inset:0;background:rgba(10,10,10,.55);display:none;place-items:center;z-index:100;padding:20px}
.mr-modal-bg.open{display:grid}
.mr-modal{background:#fff;border-radius:22px;padding:26px;max-width:440px;width:100%}
.mr-modal h3{font-family:Manrope,"Noto Sans Thai",sans-serif;margin:0 0 8px}
.mr-modal p{color:#666;line-height:1.6;margin:0 0 20px}
.mr-modal .row{display:flex;gap:10px;justify-content:flex-end}
.mr-toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:120}
.mr-toast.show{opacity:1;transform:translate(-50%,0)}
html{overflow-y:scroll}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
@media(max-width:900px){.mr-grid{grid-template-columns:1fr 1fr}}
@media(max-width:600px){.mr-grid{grid-template-columns:1fr}.mr-summary{flex-direction:column;align-items:flex-start}}
@media(prefers-reduced-motion:reduce){.mr-toast{transition:none}}
</style>

  <div class="container nav">
    <a class="brand" href="index.html">
      <span class="brand-mark">F</span>
      <span><b>FindMe AI</b><small>KMITL</small></span>
    </a>
    <nav class="nav-links" aria-label="เมนูหลัก">
      <a href="index.html">Home</a>

  <div class="container footer-row">
    <div><b>FindMe AI — KMITL</b><br><small>Lost &amp; Found, redesigned for campus.</small></div>

  </div>
</footer>

<div class="mr-modal-bg" id="mBg" role="dialog" aria-modal="true" aria-labelledby="mTitle">
  <div class="mr-modal">
    <h3 id="mTitle"></h3><p id="mText"></p>
    <div class="row"><button class="btn btn-light" id="mNo" type="button">ยกเลิก</button><button class="btn btn-dark" id="mYes" type="button">ยืนยัน</button></div>
  </div>
</div>
<div class="mr-toast" id="toast" role="status"></div>

<script src="reports-client.js?v=20261008-unified2"></script><script src="cases-client.js?v=20261008-backdrop1"></script><script src="app.js?v=20261009-th1"></script>

<script>
(() => {
  'use strict';

  /* ---- ฟังก์ชันช่วย (คัดลอกจาก app.js เพื่อให้ไฟล์นี้รันได้ด้วยตัวเอง) ---- */
  const normalize = v => String(v || '').trim().toLowerCase();
  const escapeHTML = v => String(v || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
  const reportKind = r => r.kind || (r.status === 'Submitted' ? 'found' : 'lost');
  const reportLink = r => 'matches.html?report=' + encodeURIComponent(r.id);
  const safePhoto = p => typeof p === 'string' && /^data:image\/(jpeg|png|webp);base64,/.test(p) ? p : '';
  const getIcon = c => ({ Keys: '🔑', Wallet: '👛', Phone: '📱', Bag: '👜', Bottle: '🧴', Glasses: '👓' })[c] || '📦';
  function validCoordinates(la, ln) {
    if (la === '' || ln === '' || la == null || ln == null) return null;
    const lat = Number(la), lng = Number(ln);
    return Number.isFinite(lat) && Number.isFinite(lng) && Math.abs(lat) <= 90 && Math.abs(lng) <= 180 ? { lat, lng } : null;
  }
  const googleMapsLink = p => 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(p.lat + ',' + p.lng);

  /* ================= 1) CONFIG ================= */
  const KEY = 'kmitl_reports';            // key เดียวกับ report-lost / report-found / browse / matches
  const LOG_KEY = 'kmitl_verify_log';
  const MAX_ATTEMPTS = 3;
  const PASS_SCORE = 60;

  /* สถานะ: Searching → Found (กด I found it) → Verified (ผ่าน Verify) → Returned (ได้ของคืน)
     'Returned' ถูกซ่อนจาก Browse/Matches อัตโนมัติโดย app.js เดิม */
  const STATUS = {
    Searching: ['lost', 'กำลังตามหา'],
    'Potential Match': ['found', 'มีรายการที่ตรง'],
    Found: ['pending', 'พบแล้ว — รอยืนยัน'],
    Verified: ['found', 'ยืนยันแล้ว'],
    Returned: ['resolved', 'ได้รับของคืน'],
    Locked: ['locked', 'ถูกล็อก']
  };

  /* ================= 2) DATA LAYER ================= */
  const $ = (s, r = document) => r.querySelector(s);
  const idEq = (a, b) => String(a) === String(b);

  function loadAll() {                      // ยังไม่เขียนทับถ้าข้อมูลเดิมพัง
    const saved = JSON.parse(localStorage.getItem(KEY) || '[]');
    if (!Array.isArray(saved)) throw new Error('Invalid reports');
    return saved;
  }
  function saveAll(list) {
    try { localStorage.setItem(KEY, JSON.stringify(list)); return true; }
    catch { toast('บันทึกไม่สำเร็จ พื้นที่เก็บข้อมูลอาจเต็ม'); return false; }
  }
  const isLost = r => r && typeof r === 'object' && reportKind(r) === 'lost';
  const getLost = () => loadAll().filter(r => !r.sharedReportId);
  const getOne = id => getLost().find(r => idEq(r.id, id)) || null;
  function patch(id, fields) {
    const all = loadAll(), r = all.find(x => x && idEq(x.id, id));
    if (!r) return false;
    Object.assign(r, fields);
    return saveAll(all);
  }
  function remove(id) { return saveAll(loadAll().filter(x => !(x && idEq(x.id, id)))); }

  function logAdd(id, text) {
    try {
      const l = JSON.parse(localStorage.getItem(LOG_KEY) || '[]');
      l.unshift({ id, text, at: Date.now() });
      localStorage.setItem(LOG_KEY, JSON.stringify(l.slice(0, 200)));
    } catch { /* log เป็นส่วนเสริม ไม่ให้ขวางการทำงานหลัก */ }
  }
  function logFor(id) {
    try { return JSON.parse(localStorage.getItem(LOG_KEY) || '[]').filter(l => idEq(l.id, id)); } catch { return []; }
  }

  /* ================= 3) VERIFY SCORING ================= */
  const bigrams = s => { s = String(s || '').toLowerCase().replace(/\s+/g, ''); const o = []; for (let i = 0; i < s.length - 1; i++) o.push(s.slice(i, i + 2)); return o; };
  function dice(a, b) {                     // ใช้ได้กับภาษาไทย (ไม่ต้องตัดคำ)
    const A = bigrams(a), B = bigrams(b); if (!A.length || !B.length) return 0;
    const m = new Map(); A.forEach(x => m.set(x, (m.get(x) || 0) + 1));
    let hit = 0; B.forEach(x => { if (m.get(x) > 0) { hit++; m.set(x, m.get(x) - 1); } });
    return (2 * hit) / (A.length + B.length);
  }
  function score(r, ans) {
    const detail = Math.round(Math.min(1, dice(ans.detail, `${r.itemName || ''} ${r.description || ''}`) * 1.6) * 40);
    const locSame = r.location && (normalize(r.location).includes(normalize(ans.location)) || normalize(ans.location).includes(normalize(r.location)));
    const loc = Math.round((!r.location ? .5 : locSame ? 1 : Math.min(1, dice(ans.location, r.location) * 1.5)) * 30);
    let d = 0;
    if (!r.date) d = .5;
    else if (ans.date) { const diff = Math.abs((new Date(ans.date) - new Date(r.date)) / 864e5); d = diff < 1 ? 1 : diff <= 1.5 ? .5 : 0; }
    const date = Math.round(d * 30);
    return { total: detail + loc + date, detail, loc, date };
  }

  /* ================= 4) UI HELPERS ================= */
  const fmtDate = d => { if (!d) return '-'; const t = new Date(d); return isNaN(t) ? escapeHTML(d) : t.toLocaleDateString('th-TH', { day: 'numeric', month: 'short', year: 'numeric' }); };
  const fmtDT = ts => new Date(ts).toLocaleString('th-TH', { dateStyle: 'medium', timeStyle: 'short' });
  const caseFor = r => {const related=(window.FindMeMyCases||[]).filter(c=>(c.report_id===r.id||c.linked_report_id===r.id)&&c.status!=='Rejected');return related.find(c=>c.case_status==='Closed')||related.find(c=>c.status==='Approved')||related[0];};
  const statusOf = r => {if(!r.isCloud)return r.status||'Searching';if(r.status==='Returned')return 'Returned';const c=caseFor(r);if(c?.case_status==='Closed')return 'Returned';if(c?.status==='Approved')return 'Verified';if(c||reportKind(r)==='found')return 'Found';return 'Searching';};
  const badge = r => { const [c, t] = STATUS[statusOf(r)] || ['lost', escapeHTML(statusOf(r))]; return `<span class="badge ${c}">${t}</span>`; };
  const photoBox = (r, cls = 'mr-photo') => { const p = safePhoto(r.photo); return `<div class="${cls}">${p ? `<img src="${escapeHTML(p)}" height="185" alt="${escapeHTML(r.itemName || 'รูปสิ่งของ')}">` : getIcon(r.category)}</div>`; };

  let tT;
  function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(tT); tT = setTimeout(() => t.classList.remove('show'), 2400); }
  function ask(title, text, yes) {
    return new Promise(res => {
      $('#mTitle').textContent = title; $('#mText').textContent = text; $('#mYes').textContent = yes || 'ยืนยัน';
      const bg = $('#mBg'); bg.classList.add('open'); $('#mYes').focus();
      const done = v => { bg.classList.remove('open'); $('#mYes').onclick = $('#mNo').onclick = null; res(v); };
      $('#mYes').onclick = () => done(true); $('#mNo').onclick = () => done(false);
    });
  }

  /* ================= 5) VIEW: MY REPORTS ================= */
  let filter = 'all';
  const TABS = [['all', 'ทั้งหมด'], ['Searching', 'กำลังตามหา'], ['Found', 'พบแล้ว'], ['Verified', 'ยืนยันแล้ว'], ['Returned', 'ได้รับของคืน']];

  function viewList() {
    let all;
    try {const cloud=window.FindMeOwnReports||[];all=[...cloud,...getLost().filter(r=>!cloud.some(c=>idEq(c.id,r.id)))];}
    catch { $('#view').innerHTML = `<div class="empty-state">อ่านข้อมูลรายงานไม่ได้ (ข้อมูลใน localStorage เสียหาย) ระบบยังไม่แก้ไขข้อมูลเดิม</div>`; return; }

    const n = k => k === 'all' ? all.length : all.filter(r => statusOf(r) === k).length;
    const list = filter === 'all' ? all : all.filter(r => statusOf(r) === filter);

    $('#view').innerHTML = `
      <div class="page-title">
        <div class="kicker">YOUR ACTIVITY</div>
        <h1>My Reports</h1>
        <p>ติดตามรายงานของคุณและการคืนของในที่เดียว อัปเดตอัตโนมัติขณะเปิดหน้านี้</p>
      </div>
      <div class="mr-tabs" role="group" aria-label="กรองตามสถานะ">
        ${TABS.map(([k, t]) => `<button type="button" class="mr-tab" data-filter="${k}" aria-pressed="${filter === k}">${t}<span>${n(k)}</span></button>`).join('')}
      </div>
      ${list.length ? `<div class="mr-grid">${list.map(card2).join('')}</div>` : `
        <div class="empty-state">
          <strong>${all.length ? 'ไม่มีรายการในสถานะนี้' : 'ยังไม่มีรายงาน'}</strong><br>
          <span class="meta">${all.length ? 'ลองเลือกแท็บอื่น' : 'แจ้งของหายครั้งแรก แล้วรายการจะมาแสดงที่นี่'}</span><br><br>
          <a class="btn btn-orange" href="report-lost.html">Report a lost item</a>
        </div>`}`;
  }

  function card2(r) {
    const s = statusOf(r), id = escapeHTML(r.id), enc = encodeURIComponent(r.id);
    if(r.isCloud){const c=caseFor(r);return `<article class="report-card mr-card">${photoBox(r)}<div class="mr-body">${badge(r)}<h3>${escapeHTML(r.itemName)}</h3><p class="meta">ผู้แจ้ง: ${escapeHTML(r.reporterName||window.FindMeUser?.name)}</p><p class="meta">${escapeHTML(r.category)} • ${escapeHTML(r.location)}</p><p class="meta">${reportKind(r)==='found'?'พบ':'หาย'}: ${fmtDate(r.date)} ${escapeHTML(r.time||'')}</p><p class="mr-desc">${escapeHTML(r.description)}</p></div><div class="mr-actions">${c?`<button type="button" class="btn btn-orange" data-open-case="${escapeHTML(c.id)}">${s==='Returned'?'ดูเคสที่ปิดแล้ว':'เปิดแชท / ยืนยันรับคืน'}</button>`:s!=='Returned'&&reportKind(r)==='lost'?`<button type="button" class="btn btn-orange" data-found-my-report="${id}">I found it — ยืนยันผ่านเคส</button>`:s==='Returned'?'<p class="meta">ได้รับของคืนเรียบร้อยแล้ว</p>':'<p class="meta">รอเจ้าของเปิดคำขอยืนยันและแชท</p>'}<button type="button" class="btn btn-danger" data-delete-cloud="${id}">ลบประกาศ</button></div></article>`;}
    const pt = validCoordinates(r.latitude, r.longitude);
    return `<article class="report-card mr-card">
      ${photoBox(r)}
      <div class="mr-body">
        ${badge(r)}
        <h3>${escapeHTML(r.itemName || 'Untitled item')}</h3>
        <div class="meta">${escapeHTML(r.category || 'Other')} • ${escapeHTML(r.location || 'KMITL Campus')}</div>
        <div class="meta">${reportKind(r)==='found'?'พบ':'หาย'}: ${fmtDate(r.date)} ${escapeHTML(r.time || '')}</div>
        ${pt ? `<a class="text-link" href="${googleMapsLink(pt)}" target="_blank" rel="noopener noreferrer">📍 ดูตำแหน่งจริง ↗</a>` : ''}
        ${r.description ? `<p class="mr-desc">${escapeHTML(r.description)}</p>` : ''}
      </div>
      <div class="mr-actions">
        ${s === 'Searching' || s === 'Potential Match' ? `<button type="button" class="btn btn-orange" data-act="found" data-id="${id}">I found it</button>` : ''}
        ${s === 'Found' ? `<a class="btn btn-orange" href="#/verify/${enc}">Verify ownership</a><button type="button" class="btn btn-quiet" data-act="reopen" data-id="${id}">ยังไม่เจอ</button>` : ''}
        ${s === 'Verified' ? `<button type="button" class="btn btn-dark" data-act="return" data-id="${id}">ได้รับของคืนแล้ว</button><a class="btn btn-light" href="#/verify/${enc}">ดูผล</a>` : ''}
        ${s === 'Searching' ? `<a class="btn btn-light" href="${reportLink(r)}">View matches</a>` : ''}
        ${s === 'Locked' ? `<a class="btn btn-light" href="#/verify/${enc}">รายละเอียด</a>` : ''}
        <button type="button" class="btn btn-light" data-publish-old="${id}">แชร์และใช้แชทในเว็บ</button>
        <button type="button" class="btn btn-danger" data-act="delete" data-id="${id}">ลบ</button>
      </div>
    </article>`;
  }

  /* ================= 6) VIEW: VERIFY ================= */
  function viewVerify(id) {
    let r;
    try { r = getOne(id); } catch { r = null; }
    if (!r) {
      $('#view').innerHTML = `<div class="empty-state"><strong>ไม่พบรายการนี้</strong><br><span class="meta">รายการอาจถูกลบไปแล้ว</span><br><br><a class="btn btn-dark" href="#/">กลับไป My Reports</a></div>`;
      return;
    }
    const s = statusOf(r), attempts = Number(r.verifyAttempts) || 0, left = MAX_ATTEMPTS - attempts;
    const logs = logFor(id);

    let body;
    if (s === 'Verified' || s === 'Returned') {
      body = `<div class="success"><strong>ยืนยันความเป็นเจ้าของแล้ว</strong><br>เมื่อ ${r.verifiedAt ? fmtDT(r.verifiedAt) : '-'}<br>ติดต่อรับของตามช่องทางที่ผู้พบหรือเจ้าหน้าที่แจ้ง แล้วกด "ได้รับของคืนแล้ว" ที่หน้า My Reports</div>
        <a class="btn btn-dark" href="#/">กลับไป My Reports</a>`;
    } else if (s === 'Locked' || left <= 0) {
      body = `<div class="box bad"><strong>ตอบไม่ผ่านครบ ${MAX_ATTEMPTS} ครั้งแล้ว</strong><br>รายการนี้ถูกล็อกเพื่อความปลอดภัย กรุณาติดต่อเจ้าหน้าที่พร้อมหลักฐานยืนยันตัวตน</div>
        <a class="btn btn-dark" href="#/">กลับไป My Reports</a>`;
    } else if (s !== 'Found') {
      body = `<div class="box info">กด <b>I found it</b> ที่รายการนี้ก่อน จึงจะเริ่มยืนยันได้</div><a class="btn btn-dark" href="#/">กลับไป My Reports</a>`;
    } else {
      body = `
        <div class="box info">ตอบจากความทรงจำของคุณ เหลือโอกาสตอบ <b>${left}</b> ครั้ง</div>
        <form id="vForm" novalidate>
          <div class="form-grid">
            <div class="field full"><label for="vDetail">1. ลักษณะเฉพาะของสิ่งของ</label>
              <textarea id="vDetail" required></textarea>
              <p class="hint">เช่น สี ยี่ห้อ รอยตำหนิ สติกเกอร์ ของที่อยู่ข้างใน</p></div>
            <div class="field"><label for="vDate">2. วันที่ทำหาย</label><input type="date" id="vDate" required></div>
            <div class="field"><label for="vLoc">3. สถานที่ที่เห็นครั้งสุดท้าย</label><input type="text" id="vLoc" required></div>
            <div class="field full"><label class="mr-check"><input type="checkbox" id="vOwn"> ฉันยืนยันว่าสิ่งของนี้เป็นของฉัน และข้อมูลที่ให้เป็นความจริง</label></div>
          </div>
          <div id="vResult" role="alert"></div>
          <div class="form-actions"><a class="btn btn-light" href="#/">Cancel</a><button class="btn btn-dark" type="submit">Verify ownership</button></div>
        </form>`;
    }

    $('#view').innerHTML = `
      <a class="mr-back" href="#/">← My Reports</a>
      <div class="page-title" style="margin-top:14px">
        <div class="kicker">VERIFY</div>
        <h1>Verify ownership</h1>
        <p>ยืนยันว่าสิ่งของที่พบเป็นของคุณจริงก่อนปิดรายการ</p>
      </div>
      <div class="form-card mr-verify">
        <div class="mr-summary">${photoBox(r)}<div>${badge(r)}<h2>${escapeHTML(r.itemName || 'Untitled item')}</h2><p class="meta" style="margin:0">${escapeHTML(r.category || 'Other')} • ${escapeHTML(r.location || 'KMITL Campus')}</p></div></div>
        ${body}
        ${logs.length ? `<ul class="mr-log">${logs.map(l => `<li>${fmtDT(l.at)} — ${escapeHTML(l.text)}</li>`).join('')}</ul>` : ''}
      </div>`;

    $('#vForm')?.addEventListener('submit', e => { e.preventDefault(); submitVerify(r); });
  }

  function submitVerify(r) {
    const ans = { detail: $('#vDetail').value.trim(), date: $('#vDate').value, location: $('#vLoc').value.trim() };
    const out = $('#vResult');
    if (!ans.detail || !ans.date || !ans.location) { out.innerHTML = `<div class="box bad">กรอกให้ครบทั้ง 3 ข้อ</div>`; return; }
    if (!$('#vOwn').checked) { out.innerHTML = `<div class="box bad">ติ๊กยืนยันความเป็นเจ้าของก่อน</div>`; return; }

    const sc = score(r, ans), attempts = (Number(r.verifyAttempts) || 0) + 1;
    if (sc.total >= PASS_SCORE) {
      if (patch(r.id, { status: 'Verified', verifiedAt: Date.now(), verifyAttempts: attempts })) {
        logAdd(r.id, `ยืนยันสำเร็จ (${sc.total}/100)`); toast('ยืนยันความเป็นเจ้าของสำเร็จ'); viewVerify(r.id);
      }
      return;
    }
    const left = MAX_ATTEMPTS - attempts;
    patch(r.id, { verifyAttempts: attempts, status: left <= 0 ? 'Locked' : 'Found' });
    logAdd(r.id, `ยืนยันไม่ผ่าน (${sc.total}/100)`);
    if (left <= 0) { viewVerify(r.id); return; }
    out.innerHTML = `<div class="box bad"><strong>ข้อมูลยังไม่ตรงพอ (${sc.total}/100 ต้องได้อย่างน้อย ${PASS_SCORE})</strong>
      <div class="bar"><i style="width:${sc.total}%"></i></div>
      ลักษณะ ${sc.detail}/40 • วันที่ ${sc.date}/30 • สถานที่ ${sc.loc}/30<br>เหลือโอกาสอีก ${left} ครั้ง</div>`;
  }

  /* ================= 7) ACTIONS ================= */
  document.addEventListener('click', async e => {
    const tab = e.target.closest('[data-filter]');
    if (tab) { filter = tab.dataset.filter; viewList(); return; }

    const b = e.target.closest('[data-act]'); if (!b) return;
    const id = b.dataset.id; let r;
    try { r = getOne(id); } catch { return; }
    if (!r) return;
    const name = r.itemName || 'รายการนี้';

    switch (b.dataset.act) {
      case 'found':
        if (await ask('เจอของแล้วใช่ไหม?', `"${name}" จะเปลี่ยนเป็นสถานะพบแล้ว และต้องยืนยันความเป็นเจ้าของก่อนปิดรายการ`, 'I found it')) {
          if (patch(id, { status: 'Found', foundAt: Date.now() })) {
            logAdd(id, 'ผู้แจ้งกด I found it');
            location.hash = '#/verify/' + encodeURIComponent(id);
          }
        }
        break;
      case 'reopen':
        if (patch(id, { status: 'Searching', foundAt: null })) { logAdd(id, 'กลับไปสถานะกำลังตามหา'); viewList(); }
        break;
      case 'return':
        if (await ask('ปิดรายการ', 'ยืนยันว่าได้รับของคืนแล้ว? รายการจะหายจากหน้า Browse', 'ได้รับของคืนแล้ว')) {
          if (patch(id, { status: 'Returned', returnedAt: Date.now() })) { logAdd(id, 'ได้รับของคืน'); toast('ปิดรายการแล้ว'); viewList(); }
        }
        break;
      case 'delete':
        if (await ask('ลบรายการ', `ลบ "${name}" ออกจากเครื่องนี้? ย้อนกลับไม่ได้`, 'ลบ')) {
          if (remove(id)) { toast('ลบแล้ว'); viewList(); }
        }
        break;
    }
  });

  /* ================= 8) ROUTER + SYNC ================= */
  function route() {
    const m = location.hash.match(/^#\/verify\/(.+)$/);
    window.scrollTo(0, 0);
    m ? viewVerify(decodeURIComponent(m[1])) : viewList();
  }
  window.addEventListener('findme-own-reports-updated',()=>{if(!/^#\/verify\//.test(location.hash))viewList();});
  window.addEventListener('hashchange', route);
  window.addEventListener('pageshow', route);                       // กลับมาจากหน้าอื่นแล้วข้อมูลสดเสมอ
  window.addEventListener('storage', e => {                         // อีกแท็บแก้ข้อมูล → รีเฟรชหน้านี้
    if (e.key === KEY && !/^#\/verify\//.test(location.hash)) viewList();
  });
  route();
})();
</script>
</body>
</html>
